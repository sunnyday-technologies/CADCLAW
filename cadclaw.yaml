# CADCLAW's OWN rule file, which doubles as the worked starter example.
#
# Read it as a template, but note the values are real: claim_audit scans
# CADCLAW's actual published surfaces and publish_audit allowlists CADCLAW's
# own contact address. Replace both with yours - a rule file inherited
# wholesale audits this project, not yours.
#
# Drop a copy in your repo root, edit to match your project, then run:
#   cadclaw doctor                       (verify environment)
#   cadclaw harness --rules cadclaw.yaml (run configured YAML-backed checks)
#
# Sections are optional. Missing sections skip their gate and get listed
# under confidence_budget.not_checked automatically.

schema_version: "0.9"

meta:
  project: my-project
  description: "Edit this. The project name appears in reports."
  step: ""               # path to your authoritative STEP export
  bom: ""                # path to your public BOM JSON

# Bbox-signature → human label. Labels are observational, NOT generative —
# `nema23: [56.4, 56.4, 76.6]` says "any part with this bbox signature is a
# NEMA23"; it does NOT generate one. The user authors geometry in a
# native CAD or STEP-capable package; CADCLAW labels and verifies.
# See AGENTS.md for the full rule.
#
# A signature is the SORTED (dx, dy, dz) tuple rounded to 0.1 mm.
# Run examples/init_rules.py to scaffold this section from a STEP file.
labels: {}
  # Example entries — replace with your own. Two forms are accepted:
  #
  # (a) Legacy 3-tuple — bbox signature only:
  # cbeam_4080_1m:    [40.0, 80.0, 1000.0]
  # nema23:           [56.4, 56.4, 76.6]
  # vwheel:           [10.2, 23.9, 23.9]
  #
  # (b) v0.9 dict form — adds optional orientation / face-mate hints
  #     for the orientation gate (cad.misoriented findings):
  # idler_bracket:
  #   sig: [5.0, 30.0, 30.0]
  #   expected_face: YZ          # the largest face must lie in the YZ plane
  #                              # (i.e. the part's thinnest axis is X).
  #                              # Accepts: XY | XZ | YZ.
  #   expected_against: cbeam    # reserved — face-mate adjacency check
  #   max_gap_mm: 0.5            # face-mate tolerance, default 0.5mm

belt_heuristic: true     # auto-label parts with 1.5x6 cross-section as 'belt'

expected_inventory: {}
  # cbeam_4080_1m: 17
  # nema23: 6

regions: []
  # - name: x_carriage
  #   z_range: [100.0, 250.0]
  #   expected: { vwheel: 8 }

bom_audit:
  bom_path: ""           # falls back to meta.bom if blank
  ignore_labels:
    - other
    - belt
  rules: []
    # - id: 5
    #   expected_qty: 12
    #   expected_label: connector_bar
    #   forbidden_terms: ["maximum rigidity"]

interference:
  # Skip pairs where either part has one of these labels. Belts wrap
  # pulleys (unavoidable tooth-mesh overlap); reserve skips for labels
  # with that kind of geometric justification — avoid 'vwheel' here
  # (it suppresses misplacement detection).
  skip_labels:
    - belt
  # Minimum BRep boolean overlap volume (mm^3) to report.
  min_volume_mm3: 1.0
  # Running clearance added to the suggested fix-shift when a clip is
  # reported. The suggestion shifts part A by
  # `overlap_on_axis + min_clearance_mm` along the cheapest bbox axis
  # so the moved part lands clear of the other with this clearance,
  # not tangent to it.
  min_clearance_mm: 1.0

claim_audit:
  # Point this at every surface you actually publish, not just the README.
  # CADCLAW's homepage advertises this toolchain, so it scans CADCLAW's own
  # published surfaces: the site, the article, the agent-readable summary and
  # the MCP manifest. A gate aimed only at the README is not dogfooding.
  scan_paths:
    - README.md
    - AGENTS.md
    - cadclaw_mcp/README.md
    - docs/index.html
    - docs/404.html
    - docs/ci-for-cad/index.html
    - docs/llms.txt
    - docs/.well-known/mcp-manifest.json
  stale_terms: []
  source_regex_rules: []

publish_audit:
  ignore_globs:
    - ".env*"
    - "bom/build_bom_*.py"
    - "bom/orders/**"
    - "_archive/**"
  scan_globs:
    - "README.md"
  redact_patterns:
    api_key: 'sk-[A-Za-z0-9]{32,}'
    aws_key: 'AKIA[0-9A-Z]{16}'
  email_allowlist:
    - "info@sunn3d.com"

confidence_budget:
  not_checked:
    - thread engagement (bbox signatures only)
    - native-CAD hidden/suppressed parts
    - vendor stock and pricing
    - physical build matching CAD
  assumptions:
    - all parts rigid bodies
    - mm units throughout
    - STEP export reflects native model state
