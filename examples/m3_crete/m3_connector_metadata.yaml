schema_version: connector_metadata.v0.1
assumptions:
  - Frames are first-pass local references for LLM/CADCLAW placement, not certified mating definitions.
  - Extrusion origins are centered on the authored STEP asset unless later inspection proves otherwise.
  - Gantry plate frames need human review against rendered views before release use.
  - Y gantry, XLarge X-axis gantry plate, smaller V-Slot Y-to-Z gantry plate,
    ZPMM side-rail/post motor-mount spacer, simple lower flat spacer, and
    2040/2080 frame-member frames are first-pass references from CADCLAW
    inspect-component bbox centers. Solid V Wheel frames are included for
    placement visibility at the modeled carriage interfaces.

components:
  - id: vslot_20x80_1000
    source_path: CAD/Components/V-Slot/V-Slot 20x80x1000 Linear Rail.step
    notes: Vertical post candidate used in the first M3-2 frame slice.
    frames:
      - id: bottom_end
        kind: extrusion_end
        origin_mm: [0.0, 0.0, -500.0]
        z_axis: [0.0, 0.0, -1.0]
        tags: [post, bottom]
      - id: top_end
        kind: extrusion_end
        origin_mm: [0.0, 0.0, 500.0]
        z_axis: [0.0, 0.0, 1.0]
        tags: [post, top]
      - id: inner_slot
        kind: rail_slot
        origin_mm: [0.0, 0.0, 0.0]
        tags: [slot, needs_verification]

  - id: cbeam_40x80_1000
    source_path: CAD/Advanced/Linear Rail/C-Beam 40x80x1000 Linear Rail.step
    notes: Primary 4080 C-Beam stock for M3 frame and gantry slices.
    frames:
      - id: negative_x_end
        kind: extrusion_end
        origin_mm: [-500.0, 0.0, 0.0]
        x_axis: [-1.0, 0.0, 0.0]
        tags: [rail_end, splice_candidate]
      - id: positive_x_end
        kind: extrusion_end
        origin_mm: [500.0, 0.0, 0.0]
        x_axis: [1.0, 0.0, 0.0]
        tags: [rail_end, splice_candidate]
      - id: c_opening_side
        kind: rail_slot
        origin_mm: [0.0, 0.0, 0.0]
        y_axis: [0.0, 1.0, 0.0]
        tags: [cbeam_opening, inward_facing, needs_verification]
        notes: Declared local open-channel normal used by the M3 Y-gantry inward-facing orientation check.

  - id: vslot_gantry_plate_20_80
    source_path: CAD/Components/Plates/V-Slot Gantry Plate 20-80mm.step
    notes: Smaller 3mm, roughly 125 x 80mm authored gantry plate used for Y-to-Z/Z-post carriage interfaces; hole pattern is not generated by CADCLAW.
    frames:
      - id: plate_center
        kind: mount_face
        origin_mm: [0.0, 0.0, 0.0]
        tags: [gantry_plate, center]
      - id: wheel_contact_plane
        kind: wheel_contact
        origin_mm: [0.0, 0.0, 0.0]
        tags: [gantry_plate, needs_verification]

  - id: cbeam_gantry_plate_xlarge
    source_path: CAD/Advanced/Plates/C-Beam Gantry Plate XLarge.STEP
    notes: 125 x 125 x 6mm C-Beam plate used for the M3 X-axis gantry only, 2x total; do not use for Y-to-Z/Z-post carriage interfaces in the M3-2 reference sequence.
    frames:
      - id: plate_center
        kind: mount_face
        origin_mm: [0.0, 0.0, 3.0]
        tags: [gantry_plate, center, needs_verification]
      - id: wheel_contact_plane
        kind: wheel_contact
        origin_mm: [0.0, 0.0, 3.0]
        tags: [gantry_plate, needs_verification]

  - id: solid_v_wheel_standard
    source_path: CAD/Components/Wheels/Solid V Wheel.step
    notes: Standard solid V-wheel reference for M3. Inspected envelope is 10.2 x 23.9 x 23.9 mm. The current reference places 24 wheels at modeled carriage interfaces; the remaining full-BOM wheels belong to the not-yet-selected printhead/tooling carriage.
    frames:
      - id: wheel_center
        kind: reference
        origin_mm: [0.0, 0.0, 0.0]
        tags: [wheel, v_wheel, standard, solid, needs_verification]

  - id: vslot_2080_1000
    source_path: CAD/Components/V-Slot/V-Slot 20x80x1000 Linear Rail.step
    notes: Active lower Y-direction static frame rail for the M3-2 reference.
    frames:
      - id: negative_z_end
        kind: extrusion_end
        origin_mm: [0.0, 0.0, 0.0]
        z_axis: [0.0, 0.0, -1.0]
        tags: [rail_end, lower_y_frame, active_reference, needs_verification]
      - id: positive_z_end
        kind: extrusion_end
        origin_mm: [0.0, 0.0, 1000.0]
        z_axis: [0.0, 0.0, 1.0]
        tags: [rail_end, lower_y_frame, active_reference, needs_verification]

  - id: vslot_2040_1000
    source_path: CAD/Components/V-Slot/V-Slot 20x40x1000 Linear Rail.step
    notes: Active top center spreader for the M3-2 reference; placed with the 40mm side vertical and the top face level with the top frame members.
    frames:
      - id: negative_z_end
        kind: extrusion_end
        origin_mm: [0.0, 0.0, 0.0]
        z_axis: [0.0, 0.0, -1.0]
        tags: [rail_end, top_center_spreader, active_reference, needs_verification]
      - id: positive_z_end
        kind: extrusion_end
        origin_mm: [0.0, 0.0, 1000.0]
        z_axis: [0.0, 0.0, 1.0]
        tags: [rail_end, top_center_spreader, active_reference, needs_verification]

  - id: zpmm_motor_mount_spacer
    source_path: ZPMM.step
    notes: Resized authored ZPMM export inspected on 2026-05-18. CADCLAW loaded one part with bbox signature 6.1 x 80 x 97 mm, matching the user-confirmed intended 6.1mm printed thickness. Assembly placement uses explicit source-origin recentering.
    frames:
      - id: native_center
        kind: reference
        origin_mm: [1316.785, 2283.831, 3.05]
        tags: [zpmm, motor_mount, frame_side, authored_step, native_mm_scale]
      - id: normalized_center
        kind: reference
        origin_mm: [1316.785, 2283.831, 3.05]
        tags: [zpmm, motor_mount, frame_side, authored_step, source_origin_for_recenter]

  - id: m3_flat_frame_spacer_6mm
    source_path: examples/m3_crete/generated/M3_6mm_frame_shim_4080.step
    notes: Simple 6 x 40 x 80mm lower Y-rail/post spacer, no holes or contextual bolt pattern.
    frames:
      - id: spacer_center
        kind: reference
        origin_mm: [0.0, 0.0, 0.0]
        tags: [flat_spacer, lower_y_frame, generated_simple_fixture, active_reference]

mates:
  - id: top_front_splice_reference
    kind: align
    from_instance: top_front_rail
    from_frame: positive_x_end
    to_instance: top_front_rail_splice
    to_frame: negative_x_end
    notes: First-pass declared splice relationship; hardware/connector parts are not placed yet.
  - id: x_left_plate_to_y_left_plate_reference
    kind: align
    from_instance: x_gantry_plate_left
    from_frame: plate_center
    to_instance: y_gantry_left
    to_frame: c_opening_side
    notes: First-pass reference showing X-gantry end plate handoff to the left Y gantry with the V-slot running gap.
  - id: x_right_plate_to_y_right_plate_reference
    kind: align
    from_instance: x_gantry_plate_right
    from_frame: plate_center
    to_instance: y_gantry_right
    to_frame: c_opening_side
    notes: First-pass reference showing X-gantry end plate handoff to the right Y gantry with the V-slot running gap.
