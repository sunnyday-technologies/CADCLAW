schema_version: m3_testkit_assets.v0.1
status: draft
purpose: >
  Minimal STEP asset declaration for the M3-CRETE M3-2 CADCLAW benchmark/dev
  kit. This file intentionally narrows the shared input package so AI-driven
  assembly tests are not inflated by unused OpenBuilds catalog files.

upstream_sources:
  openbuilds_step_parts_library:
    url: https://builds.openbuilds.com/projectresources/step-parts-library.162/
    notes: Original OpenBuilds STEP library source. The public CADCLAW test kit should cite this source instead of vendoring unused catalog files.

policy:
  include_only_declared_assets: true
  full_catalog_not_vendored: true
  exact_dimensions_from_step_or_validated_spec: true
  contextual_parts_generated_by_cadclaw: false
  plain_hole_free_spacers_may_be_generated_when_user_approved: true
  authored_belt_stock_extracted_from_source_when_user_approved: true

active_reference_assets:
  - id: cbeam_40x80_1000
    source_path: CAD/Advanced/Linear Rail/C-Beam 40x80x1000 Linear Rail.step
    use: 4080 C-Beam stock for Z posts, top X frame rails, top side rails, and X/Y gantry rails. X-gantry C-Beams place the 80mm side vertical. Lower Y rails are now 2080, and 2040 is used for the top center spreader plus centered splice inserts in the 2m X-direction 4080 runs.
    current_reference_quantity: 14
    generated_by_cadclaw: false
  - id: vslot_2080_1000
    source_path: CAD/Components/V-Slot/V-Slot 20x80x1000 Linear Rail.step
    use: Lower Y-direction static frame rails, replacing C-Beam at the base.
    current_reference_quantity: 2
    generated_by_cadclaw: false
  - id: vslot_2040_1000
    source_path: CAD/Components/V-Slot/V-Slot 20x40x1000 Linear Rail.step
    use: Top center spreader extrusion, placed with the 40mm side vertical and top face level with the top frame, plus one centered X-gantry splice insert and two centered top X-frame splice inserts.
    current_reference_quantity: 4
    generated_by_cadclaw: false
  - id: cbeam_gantry_plate_xlarge
    source_path: CAD/Advanced/Plates/C-Beam Gantry Plate XLarge.STEP
    use: The two X-axis printhead CARRIAGE plates only (125x125x6mm), for the toolhead's off-axis forces (Nick, 2026-05-23). Intentionally diverges from the V1.0 source's 0-XLarge; see docs/M3_FRAME_CANON.md.
    current_reference_quantity: 2
    generated_by_cadclaw: false
  - id: vslot_gantry_plate_20_80
    source_path: CAD/Components/Plates/V-Slot Gantry Plate 20-80mm.step
    use: Small 3mm gantry plate for the two X-to-Y handoff plates, the four Y-to-Z/Z-post carriage plates, and the four top-center spreader bracket/spacer plates (a 2-plate 6mm stack at each spanner end). (The two X-axis printhead carriage plates use the XLarge instead.)
    current_reference_quantity: 10
    generated_by_cadclaw: false
  - id: zpmm_motor_mount_spacer
    source_path: examples/m3_crete/generated/ZPMM_6p1_motor_mount_spacer_6mm_holes.step
    use: One-off derived 6.1mm side-rail/post motor-mount spacer at motor-mount positions only; based on the user-confirmed authored ZPMM STEP with four motor holes widened to 6mm and six 4080 C-Beam end-alignment holes added.
    current_reference_quantity: 4
    generated_by_cadclaw: true
    exception_scope: M3 custom spacer correction only; not general CADCLAW plate or motor-mount authoring.
  - id: m3_flat_frame_spacer_6mm
    source_path: examples/m3_crete/generated/M3_6mm_frame_shim_4080.step
    use: Simple 6 x 40 x 80mm lower Y-rail frame spacer; no holes or contextual bolt pattern.
    current_reference_quantity: 4
    generated_by_cadclaw: true
  - id: solid_v_wheel_standard
    source_path: CAD/Components/Wheels/Solid V Wheel.step
    use: Standard M3 V-wheel reference placed at the modeled X-to-Y, X-carriage, and Y-to-Z carriage interfaces, four wheels per gantry plate with authored hole-center alignment and a 7mm spacer/washer standoff.
    current_reference_quantity: 32
    generated_by_cadclaw: false
  - id: gt2_pulley_20t
    source_path: CAD/Components/Pulleys/GT2 Timing Pulley 20 Tooth.step
    use: Z-axis GT2 drive pulley at the top of each post; one per post.
    current_reference_quantity: 4
    generated_by_cadclaw: false
  - id: smooth_idler_wheel
    source_path: CAD/Components/Pulleys/Smooth Idler Pulley Wheel.step
    use: Z-axis belt return idler at the bottom of each post; one per post.
    current_reference_quantity: 4
    generated_by_cadclaw: false
  - id: gt2_belt_z_stock
    source_path: examples/m3_crete/generated/M3_GT2_belt_Z_942mm.step
    use: Authored GT2 belt run for the Z-axis drive, two per post. Extracted read-only from the protected M3-2 source assembly into standalone stock; not parametrically generated.
    current_reference_quantity: 8
    generated_by_cadclaw: true
    exception_scope: M3 belt stock lifted from the authored source assembly; not general CADCLAW geometry generation.
  - id: gt2_belt_y_stock
    source_path: examples/m3_crete/generated/M3_GT2_belt_Y_958mm.step
    use: Authored GT2 belt run for the Y-axis drive, two per Y-gantry, routed inside the C-beam channel. Extracted read-only from the protected M3-2 source assembly into standalone stock; not parametrically generated. The X drive uses the separately-authored VS_Belt_Pinion.
    current_reference_quantity: 4
    generated_by_cadclaw: true
    exception_scope: M3 belt stock lifted from the authored source assembly; not general CADCLAW geometry generation.
  - id: nema23_motor
    source_path: examples/m3_crete/generated/M3_NEMA23_motor_src5.step
    use: >
      NEMA 23 stepper motor, 7 placed - four Z-drive at the post tops, two
      Y-drive at the rail ends, one X-drive for the belt-pinion. Extracted
      read-only from the protected M3-2 source assembly, each preserving its
      source orientation so the motor holes register to the ZPMM mounts and the
      C-beam slots; not parametrically generated. The reference places seven
      source-oriented files (M3_NEMA23_motor_src{5,6,7,143,8,58,74}.step). A
      single generic NEMA 23 that the AI must orient itself is the harder
      benchmark variant - see provenance_review.
    current_reference_quantity: 7
    generated_by_cadclaw: true
    exception_scope: M3 motor stock lifted from the authored source assembly; not general CADCLAW geometry generation.
  - id: vs_belt_pinion
    source_path: examples/m3_crete/VS_Belt_Pinion.step
    use: >
      User-authored X-axis belt-and-pinion actuator (full-length ~2 m GT2 belt
      loop plus drive pulley) - the complete X drive, replacing a separate X
      belt and motor-mount plate. One placed; imports as two solids (belt loop
      + pulley).
    current_reference_quantity: 1
    generated_by_cadclaw: false

excluded_from_minimal_testkit:
  - source_path: CAD/Advanced/Assemblies/C-Beam Linear Actuator 1000mm.step
    reason: Macro actuator is not needed for the current M3-2 reference assembly; the Y gantry uses explicit C-Beam rail placement.
  - source_path: CAD/Components/Wheels/Delrin V Wheel.step
    reason: Duplicate practical envelope for this reference; use the solid wheel asset for the benchmark.
  - source_path: CAD/Components/Wheels/Xtreme Mini V Wheel.step
    reason: Smaller wheel family; not the M3 reference wheel.
  - source_path: CAD/Components/Wheels/Xtreme Solid V Wheel.step
    reason: Not selected for the M3 reference wheel.

# Provenance / release gating for the drive components added 2026-05-24 to close
# the kit-vs-reference gap (the assembly places these, but the minimal manifest
# had not declared them).
provenance_review:
  status: pending_license_review
  items:
    - nema23_motor
    - vs_belt_pinion
  notes: >
    The NEMA 23 motors and the VS_Belt_Pinion are extracted / user-authored
    drive parts. Their source, license, and redistributability must be cleared
    before they ship in a PUBLIC test kit (same gate as the other binary STEP
    assets). They are fine for local development now.
  fusion_kit_action: >
    The Fusion benchmark project (M3-AI-Benchmark-Kit) was staged with the 12
    structural/stock assets only; it must also receive nema23_motor (x7, or 1
    generic) and VS_Belt_Pinion before the native-track build, or the Fusion
    driver cannot place the drive train.
  benchmark_variant_decision: >
    Open benchmark-design question: hand the AI seven pre-oriented motor files
    (easier) or one generic NEMA 23 it must orient (harder, and the more honest
    test). Recommend the generic variant for the published benchmark.
