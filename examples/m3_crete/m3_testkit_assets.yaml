schema_version: m3_testkit_assets.v0.1
status: draft
purpose: >
  Minimal STEP asset declaration for the M3-CRETE M3-2 CADCLAW benchmark/dev
  kit. This file intentionally narrows the shared input package so AI-driven
  assembly tests are not inflated by unused OpenBuilds catalog files.

upstream_sources:
  openbuilds_step_parts_library:
    url: https://builds.openbuilds.com/projectresources/step-parts-library.162/
    notes: Original OpenBuilds STEP library source. The public CADCLAW test kit should cite this source instead of vendoring unused catalog files.

policy:
  include_only_declared_assets: true
  full_catalog_not_vendored: true
  exact_dimensions_from_step_or_validated_spec: true
  contextual_parts_generated_by_cadclaw: false
  plain_hole_free_spacers_may_be_generated_when_user_approved: true

active_reference_assets:
  - id: cbeam_40x80_1000
    source_path: CAD/Advanced/Linear Rail/C-Beam 40x80x1000 Linear Rail.step
    use: 4080 C-Beam stock for Z posts, top X frame rails, top side rails, and X/Y gantry rails. X-gantry C-Beams place the 80mm side vertical. Lower Y rails are now 2080, and 2040 is used for the top center spreader plus X-gantry inserts.
    current_reference_quantity: 14
    generated_by_cadclaw: false
  - id: vslot_2080_1000
    source_path: CAD/Components/V-Slot/V-Slot 20x80x1000 Linear Rail.step
    use: Lower Y-direction static frame rails, replacing C-Beam at the base.
    current_reference_quantity: 2
    generated_by_cadclaw: false
  - id: vslot_2040_1000
    source_path: CAD/Components/V-Slot/V-Slot 20x40x1000 Linear Rail.step
    use: Top center spreader extrusion, placed with the 40mm side vertical and top face level with the top frame, plus two internal X-gantry C-Beam insert extrusions.
    current_reference_quantity: 3
    generated_by_cadclaw: false
  - id: cbeam_gantry_plate_xlarge
    source_path: CAD/Advanced/Plates/C-Beam Gantry Plate XLarge.STEP
    use: X-axis plates only: two X-to-Y handoff plates at the X gantry ends plus two printhead-carriage plates, one on each side of the X gantry.
    current_reference_quantity: 4
    generated_by_cadclaw: false
  - id: vslot_gantry_plate_20_80
    source_path: CAD/Components/Plates/V-Slot Gantry Plate 20-80mm.step
    use: Smaller 3mm Y-to-Z/Z-post carriage plates plus the two top-center spreader bracket/spacer plates.
    current_reference_quantity: 6
    generated_by_cadclaw: false
  - id: zpmm_motor_mount_spacer
    source_path: ZPMM.step
    use: Authored 6.1mm side-rail/post motor-mount spacer at motor-mount positions only.
    current_reference_quantity: 4
    generated_by_cadclaw: false
  - id: m3_flat_frame_spacer_6mm
    source_path: examples/m3_crete/generated/M3_6mm_frame_shim_4080.step
    use: Simple 6 x 40 x 80mm lower Y-rail frame spacer; no holes or contextual bolt pattern.
    current_reference_quantity: 4
    generated_by_cadclaw: true
  - id: solid_v_wheel_standard
    source_path: CAD/Components/Wheels/Solid V Wheel.step
    use: Standard M3 V-wheel reference placed at the modeled X-to-Y, X-carriage, and Y-to-Z carriage interfaces, four wheels per gantry plate with authored hole-center alignment and a 7mm spacer/washer standoff.
    current_reference_quantity: 32
    generated_by_cadclaw: false

excluded_from_minimal_testkit:
  - source_path: CAD/Advanced/Assemblies/C-Beam Linear Actuator 1000mm.step
    reason: Macro actuator is not needed for the current M3-2 reference assembly; the Y gantry uses explicit C-Beam rail placement.
  - source_path: CAD/Components/Wheels/Delrin V Wheel.step
    reason: Duplicate practical envelope for this reference; use the solid wheel asset for the benchmark.
  - source_path: CAD/Components/Wheels/Xtreme Mini V Wheel.step
    reason: Smaller wheel family; not the M3 reference wheel.
  - source_path: CAD/Components/Wheels/Xtreme Solid V Wheel.step
    reason: Not selected for the M3 reference wheel.
