schema_version: "0.9"

meta:
  project: M3-CRETE
  description: >
    BOM-vs-CAD parity rules for the current CADCLAW M3-2 reference assembly.
    These rules intentionally bind only the placed STEP assets in the current
    reference round; unplaced belts, motors, fasteners, printhead
    tooling, and small fasteners remain outside this narrow check.

labels:
  cbeam_4080_1000: [40.0, 80.0, 1000.0]
  vslot_2080_1000: [20.0, 80.0, 1000.0]
  vslot_2040_1000: [20.0, 40.0, 1000.0]
  zpmm_motor_mount_spacer: [6.1, 80.0, 97.0]
  flat_frame_spacer_6mm: [6.0, 40.0, 80.0]
  vslot_gantry_plate_20_80: [3.0, 88.0, 127.0]
  cbeam_gantry_plate_xlarge: [6.0, 125.0, 125.0]
  solid_v_wheel_standard: [10.2, 23.9, 23.9]

bom_audit:
  warn_on_unmapped: false
  warn_on_mojibake: true
  ignore_labels:
    - other
  rules:
    - id: 17
      expected_label: solid_v_wheel_standard
      expected_qty: 32
      expected_design_qty: 24
      expected_mfg_type: buy
      required_terms:
        - Polycarbonate
        - 32 total

    - id: 67
      expected_label: cbeam_4080_1000
      expected_qty: 15
      expected_design_qty: 14
      spare_qty: 1
      expected_mfg_type: buy
      required_terms:
        - 14 reference pieces
        - 1 spare

    - id: 84
      expected_label: cbeam_gantry_plate_xlarge
      expected_qty: 2
      expected_design_qty: 2
      expected_mfg_type: buy
      required_terms:
        - X-axis

    - id: 69
      expected_label: vslot_gantry_plate_20_80
      expected_qty: 6
      expected_design_qty: 6
      expected_mfg_type: buy
      required_terms:
        - V-Slot 20-80
        - top center spreader
      forbidden_terms:
        - 125x125

    - id: 75
      expected_label: zpmm_motor_mount_spacer
      expected_qty: 4
      expected_design_qty: 4
      expected_mfg_type: print
      required_terms:
        - 6.1mm
        - motor mount
      forbidden_terms:
        - 4mm

    - id: 79
      expected_label: flat_frame_spacer_6mm
      expected_qty: 4
      expected_design_qty: 4
      expected_mfg_type: print
      required_terms:
        - 6mm
        - 40x80
        - flat spacer
      forbidden_terms:
        - motor mount

    - id: 86
      expected_label: vslot_2080_1000
      expected_qty: 2
      expected_design_qty: 2
      expected_mfg_type: buy
      required_terms:
        - "2080"
        - lower Y

    - id: 87
      expected_label: vslot_2040_1000
      expected_qty: 1
      expected_design_qty: 1
      expected_mfg_type: buy
      required_terms:
        - "2040"
        - top center spreader
