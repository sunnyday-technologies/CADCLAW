<text x="314" y="820" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Compile with CadQuery, render review views, run validation, produce BOM/design inventory. If</text>
<text x="314" y="844" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">views or findings are wrong, the LLM edits the spec or connector metadata and repeats.</text>
<text x="314" y="868" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="58" y="964" fill="#87a4ba" font-size="15" font-family="Arial, sans-serif" font-weight="400">Important lesson: a smaller STEP can be good geometry cleanup or a missing-part export. Check signatures, counts, and review views before trusting it.</text>
