<text x="1027.9" y="697.5" fill="#f5f8fb" font-size="15" font-family="Arial, sans-serif" text-anchor="middle">lessons</text>
<rect x="70" y="190" width="430" height="178" rx="14" fill="#0b1828" stroke="#183a5e" stroke-width="2" />
<rect x="70" y="190" width="9" height="178" fill="#97d700" />
<text x="94" y="232" fill="#f5f8fb" font-size="23" font-family="Arial, sans-serif" font-weight="700">STEP / STP Geometry</text>
<text x="94" y="270" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">BRep solids/shells; AP242 color optional.</text>
<text x="94" y="294" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="94" y="318" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Hidden CAD parts can vanish on export.</text>
<text x="94" y="342" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="94" y="366" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Inspect part counts and bbox signatures.</text>
<text x="94" y="390" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<rect x="585" y="190" width="430" height="178" rx="14" fill="#0b1828" stroke="#183a5e" stroke-width="2" />
<rect x="585" y="190" width="9" height="178" fill="#38bdf8" />
<text x="609" y="232" fill="#f5f8fb" font-size="23" font-family="Arial, sans-serif" font-weight="700">component_manifest.yaml</text>
<text x="609" y="270" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">YAML registry of authored assets.</text>
<text x="609" y="294" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="609" y="318" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">id, source_path, category, bbox sig.</text>
<text x="609" y="342" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="609" y="366" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Stops duplicates and unsafe generation.</text>
<text x="609" y="390" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<rect x="1100" y="190" width="430" height="178" rx="14" fill="#0b1828" stroke="#183a5e" stroke-width="2" />
<rect x="1100" y="190" width="9" height="178" fill="#f0c55b" />
<text x="1124" y="232" fill="#f5f8fb" font-size="23" font-family="Arial, sans-serif" font-weight="700">assembly_spec.yaml</text>
<text x="1124" y="270" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Strict YAML build contract.</text>
<text x="1124" y="294" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="1124" y="318" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Variants, instances, transforms, outputs.</text>
<text x="1124" y="342" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="1124" y="366" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Assembly sequence encodes spacing order.</text>
<text x="1124" y="390" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="1124" y="414" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Assumptions and not_built_yet stay visible.</text>
<text x="1124" y="438" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<rect x="70" y="465" width="430" height="178" rx="14" fill="#0b1828" stroke="#183a5e" stroke-width="2" />
<rect x="70" y="465" width="9" height="178" fill="#ff6b6b" />
<text x="94" y="507" fill="#f5f8fb" font-size="23" font-family="Arial, sans-serif" font-weight="700">connector_metadata.yaml</text>
<text x="94" y="545" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Planned local frames and mates.</text>
<text x="94" y="569" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="94" y="593" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Rail ends, mount faces, shaft axes.</text>
<text x="94" y="617" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="94" y="641" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Replaces placement guessing with frames.</text>
<text x="94" y="665" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<rect x="585" y="465" width="430" height="178" rx="14" fill="#0b1828" stroke="#183a5e" stroke-width="2" />
<rect x="585" y="465" width="9" height="178" fill="#97d700" />
<text x="609" y="507" fill="#f5f8fb" font-size="23" font-family="Arial, sans-serif" font-weight="700">BOM JSON + Variant Config</text>
<text x="609" y="545" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Public BOM plus variant overrides.</text>
<text x="609" y="569" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="609" y="593" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">M3-2 base; M3-1/M3-4 overrides.</text>
<text x="609" y="617" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="609" y="641" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Spacer thickness stays explicit.</text>
<text x="609" y="665" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<rect x="1100" y="465" width="430" height="178" rx="14" fill="#0b1828" stroke="#183a5e" stroke-width="2" />
<rect x="1100" y="465" width="9" height="178" fill="#38bdf8" />
<text x="1124" y="507" fill="#f5f8fb" font-size="23" font-family="Arial, sans-serif" font-weight="700">Reports + Review Images</text>
<text x="1124" y="545" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">report.json, inventory.json, PNG views.</text>
<text x="1124" y="569" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="1124" y="593" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Findings plus confidence budget.</text>
<text x="1124" y="617" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="1124" y="641" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Human review catches alignment misses.</text>
<text x="1124" y="665" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<rect x="340" y="768" width="900" height="126" rx="14" fill="#102b45" stroke="#183a5e" stroke-width="2" />
<rect x="340" y="768" width="9" height="126" fill="#b8f23f" />
<text x="364" y="810" fill="#f5f8fb" font-size="23" font-family="Arial, sans-serif" font-weight="700">File Formatting Rules That Matter</text>
<text x="364" y="848" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">Never overwrite CAD exports. Prefer AP242 when color matters. Missing work is</text>
<text x="364" y="872" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">not_built_yet, not a silent placeholder. File-size drops require signature, count, and</text>
<text x="364" y="896" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400">view checks.</text>
<text x="364" y="920" fill="#c9d8e5" font-size="18" font-family="Arial, sans-serif" font-weight="400"></text>
<text x="58" y="964" fill="#87a4ba" font-size="15" font-family="Arial, sans-serif" font-weight="400">Core idea: LLMs edit structured specs and metadata; CADCLAW compiles, validates, renders, and reports.</text>
</svg>