<text x="58" y="58" fill="#f5f8fb" font-size="44" font-family="Arial, sans-serif" font-weight="700">CADCLAW Data Contracts</text>
<text x="60" y="132" fill="#c9d8e5" font-size="22" font-family="Arial, sans-serif" font-weight="400">Explicit file types and fields that control assembly accuracy</text>
