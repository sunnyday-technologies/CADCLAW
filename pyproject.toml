[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadclaw"
version = "0.10.0"
description = "CADCLAW: automated assembly and validation for STEP CAD. Places authored parts by declared constraints, then runs geometric, structural, tolerance, and BOM-vs-CAD gates. Includes an MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Two entries on purpose: the name-only entry populates the core-metadata `Author:`
# field (without it PyPI shows "Author: None"), while the name+email entry populates
# `Author-email:`. Do NOT collapse to a single name+email entry or `Author` goes blank.
authors = [
    {name = "Sunnyday Technologies"},
    {name = "Sunnyday Technologies", email = "info@sunn3d.com"},
]
keywords = ["cad", "step", "assembly", "assembly-automation", "validation", "testing", "cadquery", "mechanical", "tolerance", "disassembly", "bom", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "cadquery>=2.7",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "vtk>=9.3",
]

[project.optional-dependencies]
# Structural frame FEA gate (cadclaw.fea). PyniteFEA core only — the gate does not
# use the VTK-based visualization path.
fea = ["PyniteFEA>=2.4,<3"]  # tested with PyniteFEA 2.4.1 (import name: Pynite)

[project.scripts]
cadclaw     = "cadclaw_cli.main:main"
cadclaw-mcp = "cadclaw_mcp.server:main"

[project.urls]
Homepage = "https://cadclaw.io"
Repository = "https://github.com/sunnyday-technologies/CADCLAW"
Issues = "https://github.com/sunnyday-technologies/CADCLAW/issues"
Documentation = "https://cadclaw.io"

[tool.setuptools.packages.find]
include = ["cadclaw*", "cadclaw_mcp*", "cadclaw_cli*", "cadharness*"]
