[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadclaw"
version = "0.6.0"
description = "CADCLAW — Automated geometric validation for STEP assemblies, with BOM-vs-CAD audit and an honesty toolchain (doctor, publish-audit, claim-audit). Includes an MCP server."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Sunnyday Technologies", email = "info@sunn3d.com"},
]
keywords = ["cad", "step", "validation", "testing", "cadquery", "mechanical", "assembly", "tolerance", "disassembly", "bom", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "cadquery>=2.7",
    "Pillow>=10.0",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.scripts]
cadclaw     = "cadclaw_cli.main:main"
cadclaw-mcp = "cadclaw_mcp.server:main"

[project.urls]
Homepage = "https://cadclaw.io"
Repository = "https://github.com/sunnyday-technologies/CADCLAW"
Issues = "https://github.com/sunnyday-technologies/CADCLAW/issues"
Documentation = "https://cadclaw.io"

[tool.setuptools.packages.find]
include = ["cadharness*", "cadclaw_mcp*", "cadclaw_cli*"]
