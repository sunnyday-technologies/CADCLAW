name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CADCLAW
        run: python -m pip install .
      - name: Generate repository geometry fixtures
        run: python tests/generate_fixtures.py
      - name: Run repository tests
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python -m unittest discover -s tests -p "test_*.py"
