name: key-guard

# Post-publication backstop only. GitHub has already received ref names,
# commits, blobs, and PR metadata before this workflow starts. Local prevention
# is provided by scripts/hooks/pre-push and scripts/create_public_pr.py.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  no-answer-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate public policy and focused guards
        run: |
          python scripts/prepublication_gate.py --public-only validate
          python -m unittest -v tests.test_prepublication_gate tests.test_key_guard

      - name: Confidentiality backstop over the exact GitHub event
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          python scripts/prepublication_gate.py --public-only ci-event
          --event-path "$GITHUB_EVENT_PATH" --event-name "$EVENT_NAME"

      - name: No answer-key paths or solved poses in the checked-out tree
        run: python scripts/check_no_answer_keys.py --tree HEAD

      - name: No answer-key paths in the pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$AFTER" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            git fetch --quiet --no-tags origin \
              "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" \
              >/dev/null 2>&1 || {
                echo "answer-key-guard: status=error surface=repository pattern=SYSTEM-GIT-READ ordinal=1" >&2
                exit 64
              }
            python scripts/check_no_answer_keys.py --range \
              "$AFTER" --not "refs/remotes/origin/$DEFAULT_BRANCH"
          else
            python scripts/check_no_answer_keys.py --range "$BEFORE..$AFTER"
          fi

      - name: No answer-key paths in the PR commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/check_no_answer_keys.py --range "$BASE..$HEAD"
